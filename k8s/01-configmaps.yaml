# ConfigMaps del Sistema de Noticias
# NOTA (para el análisis crítico): guardar contraseñas en un ConfigMap NO es seguro.
# En un entorno real se usaría un Secret. Aquí se deja así porque es lo que pide el laboratorio.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
data:
  MYSQL_ROOT_PASSWORD: "root1234"
  MYSQL_DATABASE: "noticiasdb"
  MYSQL_USER: "noticias"
  MYSQL_PASSWORD: "noticias1234"
---
# Script que MySQL ejecuta la primera vez que arranca (crea la tabla)
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
data:
  init.sql: |
    USE noticiasdb;
    CREATE TABLE IF NOT EXISTS noticias (
      id INT AUTO_INCREMENT PRIMARY KEY,
      titulo VARCHAR(200) NOT NULL,
      categoria VARCHAR(50) NOT NULL DEFAULT 'General',
      autor VARCHAR(100) NOT NULL,
      contenido TEXT NOT NULL,
      fecha TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    ) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    INSERT INTO noticias (titulo, categoria, autor, contenido)
    VALUES ('Bienvenidos al Portal de Noticias', 'General', 'Administrador',
            'Esta noticia se cargó automáticamente al iniciar la base de datos.');
---
# Configuración de conexión que usan las dos aplicaciones
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "noticiasdb"
  DB_USER: "noticias"
  DB_PASSWORD: "noticias1234"
  PORT: "3000"
